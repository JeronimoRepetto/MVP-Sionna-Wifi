[pytest]
# Deliberately pytest.ini and not pyproject.toml: this project is not an installable
# package, and a bare pyproject.toml makes some tooling treat it as one.

testpaths = tests

markers =
    mock: no requiere Sionna ni GPU. Corre con el Python de Windows
    sionna: requiere el entorno conda "sionna" y una escena cargable
    gpu: requiere CUDA + OptiX activos (las 3 variables de entorno)
    hardware: requiere nodos ESP32-S3 y router dedicado

# -ra muestra el resumen de skips y xfails: los xfail esperados deben ser visibles,
# no silenciosos. La suite los usa para registrar defectos P0 abiertos.
addopts = -ra --strict-markers

filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
    ignore::FutureWarning:chumpy.*
